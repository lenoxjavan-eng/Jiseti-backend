services:
  - type: web
    name: jiseti-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py bootstrap_admin && gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: jiseti-backend-xzt6.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jiseti-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://jiseti-frontend.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: jiseti-db
    plan: free
